<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c4a3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="數學課">
<meta property="og:title" content="爺孫數學課">
<meta property="og:description" content="教孫子數學，從國中到大學微積分">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">

</head><body>
<title>爺孫數學課</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=STIX+Two+Text:ital,wght@0,600;1,600&family=Kalam:wght@700&display=swap">
<style>
/* 版面：教室一面牆。上＝孫子＋對話泡泡，中＝黑板（題目），下＝大按鈕（答案）。刻意單一主題（教室），不跟深色模式。 */
:root{
  --wall:#d9e6de; --wall-dot:#c8d9ce;
  --board:#2c4a3b; --board-in:#335645; --frame:#8b5b36;
  --chalk:#fbf8ee; --chalk-dim:#cfd9cf;
  --paper:#fffdf5; --ink:#24302a; --ink-soft:#5b6b62;
  --red:#d2382b; --gold:#f2b41c; --go:#ee7b30; --go-dark:#c25a17;
  --ok:#3c9a58; --ok-dark:#2b7442; --no:#a9b2ad;
  --card:#ffffff; --card-edge:#b9c7be;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-math:"STIX Two Text","Times New Roman",serif;
  --f-hand:"Kalam","Noto Sans TC",cursive;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
html{font-size:clamp(22px,min(6vw,4.4vh),44px)}
body{background:var(--wall);background-image:radial-gradient(var(--wall-dot) 1.5px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:var(--f-ui);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
#app{height:100%;max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:.35rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:.35rem;box-sizing:border-box}
.math,.ans,.q{font-family:var(--f-math)}
i{font-style:italic}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.05}
.fr>span:first-child{border-bottom:.07em solid currentColor;padding:0 .12em}
.fr>span{font-size:.82em}
.sq{white-space:nowrap}.sq>span{border-top:.07em solid currentColor;padding:0 .08em}
sup,sub{font-size:.6em;line-height:0}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin-right:.15em}
.lim small{font-size:.45em;margin-top:.1em}
.int{display:inline-flex;align-items:center;vertical-align:middle}
.int b{font-size:1.5em;font-weight:400;line-height:1}
.int .lims{display:inline-flex;flex-direction:column;justify-content:space-between;font-size:.58em;height:2.6em;margin-left:-.1em;margin-right:.15em}
.mat{display:inline-grid;gap:.05em .6em;padding:0 .35em;border-left:.08em solid currentColor;border-right:.08em solid currentColor;vertical-align:middle;line-height:1.15;text-align:center}
.cnk{display:inline-flex;align-items:center}.cnk span{display:inline-flex;flex-direction:column;font-size:.55em;line-height:1.05;margin-left:.05em}

/* 上方列 */
.top{display:flex;align-items:center;gap:.4rem;min-height:1.9rem}
.home{width:1.9rem;height:1.9rem;border-radius:50%;background:var(--card);box-shadow:0 .1rem 0 var(--card-edge);font-size:1rem;display:grid;place-items:center}
.dots{flex:1;display:flex;justify-content:center;gap:.3rem}
.dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--card);border:.1rem solid var(--card-edge)}
.dot.on{background:var(--gold);border-color:#c98f00}
.dot.cur{background:var(--go);border-color:var(--go-dark);transform:scale(1.25)}
.love{font-size:.9rem;background:var(--card);border-radius:1rem;padding:.1rem .5rem;box-shadow:0 .1rem 0 var(--card-edge);white-space:nowrap}

/* 孫子＋泡泡 */
.scene{display:flex;align-items:flex-end;gap:.3rem;position:relative}
.kid{flex:none;width:4.6rem;height:5.6rem;position:relative}
.kid svg{width:100%;height:100%;display:block;overflow:visible}
.kid.big{width:8rem;height:9.6rem}
.homewrap .kid.big{width:6.6rem;height:7.9rem}
.homewrap{min-height:0}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3%)}}
.jump{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{30%{transform:translateY(-22%) scale(1.04)}60%{transform:translateY(0)}80%{transform:translateY(-6%)}}
.tilt{animation:tilt .8s ease-in-out}
@keyframes tilt{25%{transform:rotate(-7deg)}75%{transform:rotate(5deg)}}
.bubble{flex:1;min-width:0;background:var(--card);border-radius:.8rem;padding:.35rem .55rem;font-size:1.15rem;line-height:1.3;position:relative;margin-bottom:1.4rem;box-shadow:0 .12rem 0 var(--card-edge);text-wrap:balance}
.bubble::before{content:"";position:absolute;left:-.45rem;bottom:.5rem;border:.3rem solid transparent;border-right:.5rem solid var(--card);border-left:0}
.bubble.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.85);opacity:.3}100%{transform:none;opacity:1}}
.chip{position:absolute;left:50%;bottom:-.2rem;transform:translateX(-50%);background:var(--board);color:var(--chalk);font-size:.55rem;padding:.05rem .35rem;border-radius:.4rem;white-space:nowrap;font-family:var(--f-ui)}

/* 黑板 */
.board{flex:1 1 auto;min-height:0;background:radial-gradient(ellipse at 50% 40%,var(--board-in),var(--board));border:.35rem solid var(--frame);border-radius:.45rem;box-shadow:inset 0 0 1.2rem rgba(0,0,0,.35),0 .15rem 0 #6c4426;color:var(--chalk);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:.3rem}
.q{font-size:2.3rem;text-align:center;line-height:1.35;white-space:nowrap;font-weight:600}
.q .sub{font-size:.75em;color:var(--chalk-dim);font-family:var(--f-ui);font-weight:700}
.q .emo{font-family:var(--f-ui);font-size:.9em;letter-spacing:.05em}
.q svg{display:block;margin:0 auto;height:3.4em;width:auto;overflow:visible}

/* 答案 */
.answers{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.answers.one{grid-template-columns:1fr}
.ans{background:var(--card);border-radius:.6rem;min-height:3.2rem;font-size:1.9rem;font-weight:600;box-shadow:0 .18rem 0 var(--card-edge);display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;padding:0 .3rem;position:relative;transition:transform .08s}
.answers.one .ans{min-height:2.45rem;font-size:1.45rem}
.ans:active{transform:translateY(.12rem);box-shadow:0 .06rem 0 var(--card-edge)}
.ans.glow{animation:glow 1.6s ease-in-out 2}
@keyframes glow{50%{box-shadow:0 .18rem 0 var(--card-edge),0 0 0 .2rem var(--gold)}}
.ans.bad{background:#e7ebe8;color:var(--no);box-shadow:none;animation:shake .4s}
.ans.bad::after{content:"✗";position:absolute;right:.3rem;top:.05rem;color:var(--red);font-family:var(--f-ui);font-size:.7em}
@keyframes shake{25%{transform:translateX(-.25rem)}75%{transform:translateX(.25rem)}}
.ans.good{background:var(--ok);color:#fff;box-shadow:0 .18rem 0 var(--ok-dark)}
.ans.good::after{content:"";position:absolute;inset:.25rem;border:.2rem solid rgba(255,255,255,.85);border-radius:50%/60%;animation:ring .4s ease-out}
@keyframes ring{from{transform:scale(1.5);opacity:0}}
.ans.reveal{animation:glow 1s ease-in-out infinite;background:#e8f6ec}

.big-btn{background:var(--go);color:#fff;border-radius:.8rem;min-height:3rem;font-size:1.5rem;font-family:var(--f-ui);font-weight:900;box-shadow:0 .2rem 0 var(--go-dark);width:100%;letter-spacing:.08em}
.big-btn:active{transform:translateY(.15rem);box-shadow:0 .05rem 0 var(--go-dark)}
.big-btn.green{background:var(--ok);box-shadow:0 .2rem 0 var(--ok-dark)}
.soft-btn{background:var(--card);border-radius:.7rem;min-height:2.4rem;font-size:1.05rem;box-shadow:0 .15rem 0 var(--card-edge);font-family:var(--f-ui);font-weight:900;padding:0 .6rem}
.row{display:flex;gap:.4rem}.row>*{flex:1}
.after{display:flex;flex-direction:column;gap:.4rem}
.after .ans{min-height:2.6rem}

/* 首頁 */
.homewrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.5rem}
.logo{text-align:center;font-size:1.6rem;font-weight:900;letter-spacing:.12em;color:var(--board)}
.logo small{display:block;font-size:.55rem;letter-spacing:.3em;color:var(--ink-soft)}
.homescene{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.homescene .bubble{margin:0;flex:none;max-width:100%;text-align:center}
.homescene .bubble::before{left:50%;bottom:-.5rem;transform:translateX(-50%);border:.3rem solid transparent;border-top:.5rem solid var(--card);border-bottom:0}
.stat{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap}
.stat span{background:var(--card);border-radius:1rem;padding:.1rem .55rem;font-size:.85rem;box-shadow:0 .1rem 0 var(--card-edge)}
.tiny{font-size:.6rem;color:var(--ink-soft);text-align:center;font-weight:700}

/* 課程地圖 */
.mapwrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:.5rem;padding-bottom:1rem}
.stage-h{font-size:1.1rem;font-weight:900;color:var(--board);display:flex;align-items:center;gap:.3rem}
.stage-h::after{content:"";flex:1;height:.1rem;background:var(--card-edge)}
.units{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.unit{background:var(--card);border-radius:.6rem;min-height:2.8rem;box-shadow:0 .15rem 0 var(--card-edge);font-size:.95rem;font-weight:900;display:flex;align-items:center;justify-content:space-between;padding:.2rem .45rem;gap:.2rem;text-align:left}
.unit .sc{font-family:var(--f-hand);color:var(--red);font-size:1.15rem}
.unit.lock{background:#e6ebe8;color:var(--no);box-shadow:none}
.unit.next{background:#fff1e3;box-shadow:0 .15rem 0 var(--go),0 0 0 .12rem var(--go) inset}

/* 考試 */
.examwrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.5rem;align-items:center;position:relative}
.testing{font-size:1.6rem;font-weight:900;color:var(--board);text-align:center}
.pencil{display:inline-block;animation:write .5s ease-in-out infinite alternate}
@keyframes write{to{transform:translate(.4rem,.15rem) rotate(8deg)}}
.result{display:flex;align-items:flex-end;justify-content:center;gap:.2rem;width:100%}
.paper{background:var(--paper);background-image:repeating-linear-gradient(transparent 0 1.05rem,#d9e3f0 1.05rem 1.1rem);width:9rem;max-width:62%;aspect-ratio:3/4;border-radius:.2rem;box-shadow:0 .25rem .6rem rgba(0,0,0,.18);transform:rotate(-4deg);position:relative;padding:.4rem .5rem;box-sizing:border-box;animation:slide .6s cubic-bezier(.2,1.3,.5,1)}
@keyframes slide{from{transform:translateY(60%) rotate(-25deg);opacity:0}}
.paper .ph{font-size:.6rem;line-height:1.35;color:var(--ink-soft);border-bottom:.06rem solid var(--ink-soft);padding-bottom:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper .score{top:30%!important}
.paper .score{position:absolute;left:0;right:0;top:22%;text-align:center;font-family:var(--f-hand);color:var(--red);font-size:4rem;line-height:1;animation:stampin .5s .5s both cubic-bezier(.3,1.8,.5,1)}
.paper .score::after{content:"";position:absolute;left:50%;top:50%;width:1.25em;height:.95em;border:.08em solid var(--red);border-radius:50%;transform:translate(-50%,-55%) rotate(-8deg)}
@keyframes stampin{from{transform:scale(2.4);opacity:0}}
.paper .stamp{position:absolute;right:.25rem;bottom:.4rem;width:2.4rem;height:2.4rem;border:.12rem solid var(--red);border-radius:50%;color:var(--red);display:grid;place-items:center;font-size:.85rem;font-weight:900;transform:rotate(-14deg);animation:stampin .4s 1.1s both}
.paper .note{position:absolute;left:.4rem;bottom:.45rem;font-size:.6rem;color:var(--red);font-weight:900}
.examwrap .bubble{margin:0;flex:none;text-align:center;width:100%;box-sizing:border-box}
.examwrap .bubble::before{display:none}

/* 畢業 */
.diploma{background:var(--paper);border:.2rem double #b88b2d;border-radius:.3rem;padding:.4rem .8rem;text-align:center;font-size:1.3rem;font-weight:900;color:#8a5e10;box-shadow:0 .2rem .5rem rgba(0,0,0,.15);animation:slide .7s cubic-bezier(.2,1.3,.5,1)}
.diploma small{display:block;font-size:.65rem;color:var(--ink-soft);font-weight:700}

/* 選稱呼 */
.pick3{display:grid;grid-template-columns:1fr;gap:.45rem}
.names{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
.grid2 .soft-btn{min-height:2.1rem;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.35rem}
.tile{background:var(--card);border-radius:.6rem;padding:.25rem .3rem;box-shadow:0 .12rem 0 var(--card-edge);text-align:center}
.tile span{display:block;font-size:.6rem;color:var(--ink-soft)}
.tile b{font-size:1.3rem;color:var(--board);font-variant-numeric:tabular-nums}.tile small{font-size:.55rem;margin-left:.1em}
.logrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:.5rem;padding:.15rem .5rem;font-size:.8rem;box-shadow:0 .1rem 0 var(--card-edge)}
.logrow .sc{font-family:var(--f-hand);color:var(--red);font-size:1.2rem}
.codebox{background:var(--board);color:var(--chalk);border-radius:.6rem;padding:.4rem;text-align:center;display:flex;flex-direction:column;gap:.15rem}
.codebox small{font-size:.6rem;color:var(--chalk-dim)}
.codebox b{font-family:var(--f-math);font-size:1.9rem;letter-spacing:.12em}
#codein{font:inherit;font-size:1.5rem;font-weight:900;text-align:center;letter-spacing:.1em;padding:.3rem;border:.12rem solid var(--card-edge);border-radius:.6rem;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text;text-transform:uppercase}
.own{display:flex;flex-direction:column;gap:.45rem}
#kidname{font:inherit;font-size:1.6rem;font-weight:900;text-align:center;padding:.3rem;border:.12rem solid var(--card-edge);border-radius:.6rem;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
#kidname:focus{outline:4px solid var(--gold);outline-offset:2px}
.row .soft-btn{padding:0 .3rem;white-space:nowrap;font-size:.95rem}
.pick3 .big-btn{min-height:2.7rem}

.heart{position:fixed;pointer-events:none;font-size:1.4rem;z-index:20;animation:float 1.6s ease-out forwards}
@keyframes float{to{transform:translateY(-5rem) scale(1.4);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;width:100%;height:100%}
#app{position:relative;z-index:1}
.lesson{box-sizing:border-box;padding-bottom:.45rem}
.tight .kid:not(.big){width:3.4rem;height:4.1rem}
.tight .bubble{font-size:1rem}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
@media (min-aspect-ratio:4/3) and (min-width:700px){
  .lesson{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto auto 1fr;column-gap:.6rem}
  .lesson .top{grid-column:1/-1}
  .lesson .scene{grid-column:1;grid-row:2}
  .lesson .board{grid-column:1;grid-row:3}
  .lesson .answers,.lesson .after{grid-column:2;grid-row:2/4;align-content:center}
}
</style>

<div id="app"></div>
<canvas id="fx"></canvas>

<script>
'use strict';
/* ================= 亂數（可重現：seed） ================= */
let seed = (Date.now() % 2147483647) | 0;
function rnd(){ seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const R = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sgn = () => rnd() < .5 ? -1 : 1;

/* ================= 數學排版小工具 ================= */
const M = '−';
const N = n => n < 0 ? M + (-n) : '' + n;
const P = n => n < 0 ? '(' + M + (-n) + ')' : '' + n;
const X = '<i>x</i>';
const sup = (b, e) => b + '<sup>' + e + '</sup>';
const fr = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const sq = x => `<span class="sq">√<span>${x}</span></span>`;
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
function F(p, q){ if (q < 0) { p = -p; q = -q; } const g = gcd(p, q); p /= g; q /= g; if (q === 1) return N(p); return (p < 0 ? M : '') + fr(Math.abs(p), q); }
const pm = a => (a < 0 ? ' − ' : ' + ') + Math.abs(a);
function term(abs, d, v){ const co = (abs === 1 && d > 0) ? '' : String(abs); return d === 0 ? co : d === 1 ? co + v : co + sup(v, d); }
function poly(c, v = X){ const n = c.length - 1; let s = ''; c.forEach((a, i) => { if (!a) return; const d = n - i; const t = term(Math.abs(a), d, v); s += s ? (a < 0 ? ' − ' : ' + ') + t : (a < 0 ? M : '') + t; }); return s || '0'; }
const ev = (c, x) => c.reduce((s, a) => s * x + a, 0);
const lim = (v, to) => `<span class="lim">lim<small>${v}→${to}</small></span>`;
const integ = (lo, hi) => `<span class="int"><b>∫</b>${hi === undefined ? '' : `<span class="lims"><span>${hi}</span><span>${lo}</span></span>`}</span>`;
const mat = rows => `<span class="mat" style="grid-template-columns:repeat(${rows[0].length},auto)">${rows.flat().map(v => `<span>${N(v)}</span>`).join('')}</span>`;
const sub = t => `<div class="sub">${t}</div>`;
const emo = t => `<span class="emo">${t}</span>`;
const Cnk = (n, k) => `<span class="cnk">C<span><span>${n}</span><span>${k}</span></span></span>`;
const fact = n => n <= 1 ? 1 : n * fact(n - 1);
const comb = (n, k) => fact(n) / fact(k) / fact(n - k);
const ex = e => sup('e', e);

function tri(a, b, c){ // 直角三角形：a 直立邊、b 底邊、c 斜邊
  const L = (x, y, t, anchor = 'middle') => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="40" font-family="STIX Two Text,serif" font-weight="600" fill="${t === '?' ? '#f2b41c' : '#fbf8ee'}">${t}</text>`;
  return `<svg viewBox="-10 0 330 200"><path d="M50 170 L50 25 L270 170 Z" fill="none" stroke="#fbf8ee" stroke-width="5" stroke-linejoin="round"/><path d="M50 148 H72 V170" fill="none" stroke="#fbf8ee" stroke-width="3"/>${L(24, 112, a, 'end')}${L(160, 210, b)}${L(178, 88, c, 'start')}</svg>`;
}

/* 出題：mk(題目, 正解, 誘答[], 額外) → 一定 4 個不重複選項 */
function mk(q, ans, ds, extra = {}){
  const o = [ans];
  for (const d of ds) { if (o.length >= 4) break; if (d != null && !o.includes(d)) o.push(d); }
  let g = 0; while (o.length < 4 && extra.fill && g++ < 80) { const f = extra.fill(); if (f != null && !o.includes(f)) o.push(f); }
  return { q, ans, opts: shuffle(o), ask: extra.ask };
}
const jitter = () => pick([-3, -2, -1, 1, 2, 3, 4, 5, -5, 10, -10]);
function mkN(q, ans, ds, extra = {}){ return mk(q, N(ans), ds.map(N), { fill: () => N(ans + jitter()), ...extra }); }
const xq = sub(X + ' = ?');

/* ================= 22 個單元：國一 → 大學 ================= */
const STAGES = ['國一', '國二', '國三', '高一', '高二', '高三', '大學'];
const LOOK = [0, 0, 0, 1, 1, 1, 2];
const BASE = [

const CH = '#fbf8ee', YL = '#f2b41c', DM = 'rgba(251,248,238,.22)', BD = '#2f4f3f';
const lab = (x, y, t, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a || 'middle'}" dominant-baseline="middle" font-size="${o.s || 34}" font-family="STIX Two Text,Noto Sans TC,serif" font-weight="600" stroke="none" fill="${o.c || (String(t).includes('?') ? YL : CH)}">${t}</text>`;
const pic = (vb, body) => `<svg viewBox="${vb}" fill="none" stroke="${CH}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">${body}</svg>`;
const pis = n => (n === 1 ? '' : n) + 'π';
function clock(h, m){
  let s = `<circle cx="100" cy="100" r="88"/>`;
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6, r1 = i % 3 ? 78 : 70; s += `<line x1="${100 + r1 * Math.sin(a)}" y1="${100 - r1 * Math.cos(a)}" x2="${100 + 86 * Math.sin(a)}" y2="${100 - 86 * Math.cos(a)}" stroke-width="${i % 3 ? 3 : 5}"/>`; }
  const ha = ((h % 12) * 30 + m * .5) * Math.PI / 180, ma = m * 6 * Math.PI / 180;
  s += `<line x1="100" y1="100" x2="${100 + 46 * Math.sin(ha)}" y2="${100 - 46 * Math.cos(ha)}" stroke-width="9"/><line x1="100" y1="100" x2="${100 + 72 * Math.sin(ma)}" y2="${100 - 72 * Math.cos(ma)}" stroke-width="5" stroke="${YL}"/><circle cx="100" cy="100" r="7" fill="${CH}"/>`;
  return pic('0 0 200 200', s);
}
const G = (x, y) => [30 + 40 * x, 270 - 40 * y];
function grid(body){
  let s = '';
  for (let i = 0; i <= 6; i++) { const [x] = G(i, 0), [, y] = G(0, i); s += `<line x1="${x}" y1="30" x2="${x}" y2="270" stroke="${DM}" stroke-width="2"/><line x1="30" y1="${y}" x2="270" y2="${y}" stroke="${DM}" stroke-width="2"/>`; }

  return pic('0 0 300 300', s + body);
}

const segG = (p, q) => { const [a, b] = G(...p), [c, d] = G(...q); return `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`; };

const fx = document.getElementById('fx'), cx = fx.getContext('2d'); let parts = [], raf = 0;
function confetti(n){
  const dpr = Math.min(devicePixelRatio || 1, 1.5); fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#f2b41c', '#ee7b30', '#d2382b', '#3c9a58', '#3f6fb4', '#ff8fb0'];
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2 + (rnd() - .5) * 80, y: innerHeight * .35, vx: (rnd() - .5) * 14, vy: -rnd() * 14 - 4, r: rnd() * 6, vr: (rnd() - .5) * .4, w: 6 + rnd() * 6, h: 4 + rnd() * 6, c: pick(cols), life: 0 });
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life < 160 && p.y < innerHeight + 20);
  for (const p of parts) { p.life++; p.vy += .35; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
}

/* 測試用：window.__gen(i,k) 產生一題 */
window.__gen = (i, k) => UNITS[i].g(k); window.__units = UNITS.length;
go(!S.title ? 'setup' : !S.kid ? 'name' : 'home');
